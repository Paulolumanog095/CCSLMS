name: lab_inventory
description: Computer Laboratory Inventory System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File picking (avatar upload)
  file_picker: ^8.0.0

  # Windows toast notifications
  local_notifier: ^0.1.3

  # Supabase
  supabase_flutter: ^2.3.4

  # State management
  provider: ^6.1.1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Internationalization & formatting
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.2.1

  # Charts (dashboard)
  fl_chart: ^0.68.0

  # PDF generation & printing (reports)
  pdf: ^3.10.8
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/header.png